# ───────────────────────────────────────────────────────────────────────────
# GitHub Actions — Payneteasy API Key Pair Factory (Tauri 2 + React + Rust)
#
# Tauri produces native installers per-OS (no cross-compilation), so each
# platform builds on its own runner:
#   • test            → Ubuntu (lint + typecheck + crypto unit tests)
#   • build (linux)   → Ubuntu        → .deb / .rpm / .AppImage
#   • build (macos)   → macOS (arm64)  → .dmg + versioned .app .zip
#   • build (windows) → Windows        → .msi / NSIS .exe + versioned portable .exe
#
# Builds run on pushes to main, PRs, version tags (v1.0.3 or bare 1.0.3) and
# manual dispatch.
# On a version tag the installers are attached to a *draft* GitHub Release
# (review the auto-generated notes, then hit Publish).
# Flatpak is not built here — Tauri can't produce it natively; it needs a
# separate flatpak-builder job and is left as a follow-up.
#
# Rust is pinned to the same version as local dev / src-tauri/rust-toolchain.toml.
# ───────────────────────────────────────────────────────────────────────────

name: build

on:
  push:
    branches: [main]
    tags: ["v*", "[0-9]*"]   # v1.0.3 and bare 1.0.3 both trigger a release
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref (keep tag/release runs intact).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  RUST_VERSION: "1.94.1"
  CARGO_TERM_COLOR: always

jobs:
  # ───────────────────────── test (lint + typecheck + unit tests) ─────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri 2 Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential curl wget file \
            libxdo-dev libssl-dev pkg-config \
            libayatana-appindicator3-dev \
            librsvg2-dev patchelf

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck + production bundle
        run: npm run build           # tsc typecheck + vite production bundle

      - name: rustfmt
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked

  # ───────────────────────────── build (per-OS bundles) ───────────────────
  build:
    name: build (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: macos        # Apple Silicon (aarch64)
            os: macos-latest
          - name: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri 2 Linux system dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential curl wget file \
            libxdo-dev libssl-dev pkg-config \
            libayatana-appindicator3-dev \
            librsvg2-dev patchelf \
            xdg-utils

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build (tauri)
        run: npm run tauri build

      # Portable build: `tauri build` already leaves the raw, self-contained
      # executable next to the bundles. Copy it out under a descriptive,
      # version-stamped name so it lands in the artifacts as a portable .exe
      # (no installer needed). Version is read from tauri.conf.json to match the
      # version Tauri bakes into the .msi / NSIS .exe filenames.
      - name: Stage portable Windows executable
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $ver = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          copy "src-tauri\target\release\pne-akpf.exe" "src-tauri\target\release\Payneteasy-KeyGen_${ver}_x64-portable.exe"

      # macOS .app is a bundle *directory* — it can't be attached to a Release as
      # a single asset, so pack it into a versioned .zip (matching Tauri's
      # `{name}_{version}_{arch}` filename convention). `ditto` preserves the
      # bundle structure / signatures.
      - name: Zip macOS .app
        if: matrix.name == 'macos'
        run: |
          app_dir="src-tauri/target/release/bundle/macos"
          app="$(ls -d "$app_dir"/*.app | head -n1)"
          ver="$(jq -r .version src-tauri/tauri.conf.json)"
          arch="$(uname -m)"   # arm64 on Apple-Silicon runners
          out="$app_dir/Payneteasy-KeyGen_${ver}_${arch}.zip"
          ditto -c -k --keepParent "$app" "$out"

      - name: Upload Linux artifacts
        if: matrix.name == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: keygen-${{ matrix.name }}-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Upload macOS artifacts
        if: matrix.name == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: keygen-${{ matrix.name }}-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.zip

      - name: Upload Windows artifacts
        if: matrix.name == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: keygen-${{ matrix.name }}-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/Payneteasy-KeyGen_*_x64-portable.exe

  # ───────────────────────── release (attach bundles to a tag) ────────────
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Tauri names each bundle with its own per-format convention, so normalise
      # every asset to a single scheme before publishing:
      #   {Product}-{version}-{os}-{arch}.{ext}
      # The extension already identifies the format, so no type segment — except
      # the two Windows .exe (NSIS installer vs portable) which share an
      # extension and get a -setup / -portable suffix to disambiguate.
      # e.g. Payneteasy.API.Key.Pair.Factory-1.0.3-windows-x86_64-portable.exe
      # OS is taken from the artifact folder (keygen-<os>-<sha>); arch/ext are
      # derived from the original filename.
      - name: Normalise asset filenames
        run: |
          set -eu
          ver="${GITHUB_REF_NAME#v}"            # strip a leading v: v1.0.3 -> 1.0.3
          product="Payneteasy.API.Key.Pair.Factory"
          mkdir -p dist
          while IFS= read -r -d '' f; do
            base="$(basename "$f")"

            case "$f" in
              */keygen-linux-*)   os=linux ;;
              */keygen-macos-*)   os=macos ;;
              */keygen-windows-*) os=windows ;;
              *)                  os=unknown ;;
            esac

            suffix=""
            case "$base" in
              *.AppImage)     ext=AppImage ;;
              *.deb)          ext=deb ;;
              *.rpm)          ext=rpm ;;
              *.dmg)          ext=dmg ;;
              *.msi)          ext=msi ;;
              *-setup.exe)    ext=exe; suffix="-setup" ;;
              *portable*.exe) ext=exe; suffix="-portable" ;;
              *.exe)          ext=exe ;;
              *.zip)          ext=zip ;;
              *)              continue ;;    # skip anything unexpected
            esac

            case "$base" in
              *aarch64*|*arm64*)      arch=aarch64 ;;
              *x86_64*|*amd64*|*x64*) arch=x86_64 ;;
              *)                      arch=x86_64 ;;
            esac

            out="dist/${product}-${ver}-${os}-${arch}${suffix}.${ext}"
            cp "$f" "$out"
            echo "  $base  ->  $(basename "$out")"
          done < <(find artifacts -type f -print0)
          echo "--- release assets ---"
          ls -1 dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: dist/*
