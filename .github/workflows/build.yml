# ───────────────────────────────────────────────────────────────────────────
# GitHub Actions — Payneteasy API Key Pair Factory (Tauri 2 + React + Rust)
#
# Tauri produces native installers per-OS (no cross-compilation), so each
# platform builds on its own runner:
#   • test            → Ubuntu (lint + typecheck + crypto unit tests)
#   • build (linux)   → Ubuntu  → .deb / .rpm / .AppImage + raw binary
#   • build (macos)   → macOS   → .dmg / .app
#   • build (windows) → Windows → .msi / NSIS .exe + portable .exe
#
# Builds run on pushes to main, PRs, version tags (v*) and manual dispatch.
# On a version tag, the installers are attached to a GitHub Release.
#
# Rust is pinned to the same version as local dev / src-tauri/rust-toolchain.toml.
# ───────────────────────────────────────────────────────────────────────────

name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref (keep tag/release runs intact).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  RUST_VERSION: "1.94.1"
  CARGO_TERM_COLOR: always

jobs:
  # ───────────────────────── test (lint + typecheck + unit tests) ─────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri 2 Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential curl wget file \
            libxdo-dev libssl-dev pkg-config \
            libayatana-appindicator3-dev \
            librsvg2-dev patchelf

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck + production bundle
        run: npm run build           # tsc typecheck + vite production bundle

      - name: rustfmt
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked

  # ───────────────────────────── build (per-OS bundles) ───────────────────
  build:
    name: build (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: macos
            os: macos-latest
          - name: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri 2 Linux system dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential curl wget file \
            libxdo-dev libssl-dev pkg-config \
            libayatana-appindicator3-dev \
            librsvg2-dev patchelf \
            xdg-utils

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build (tauri)
        run: npm run tauri build

      # Portable build: `tauri build` already leaves the raw, self-contained
      # executable next to the bundles. Copy it out under a descriptive name so
      # it lands in the artifacts as a portable .exe (no installer needed).
      - name: Stage portable Windows executable
        if: matrix.name == 'windows'
        shell: pwsh
        run: copy "src-tauri\target\release\pne-akpf.exe" "src-tauri\target\release\Payneteasy-KeyGen-portable.exe"

      - name: Upload Linux artifacts
        if: matrix.name == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: keygen-linux-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Upload macOS artifacts
        if: matrix.name == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: keygen-macos-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app

      - name: Upload Windows artifacts
        if: matrix.name == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: keygen-windows-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/Payneteasy-KeyGen-portable.exe

  # ───────────────────────── release (attach bundles to a tag) ────────────
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          fail_on_unmatched_files: false
          files: artifacts/**/*
